<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribute to Dr. José Rizal</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="tribute">
    <p class="subtitle">A Tribute to</p>
    <h1 class="name">Dr. José Rizal</h1>
    <p class="dates">1861 &ndash; 1896</p>

    <!-- PUT YOUR IMAGE FILE NAME IN src -->
    <div class="photo-frame">
      <img src="img/rizal.jpg" alt="Dr. José Rizal">
    </div>

    <p class="message">National Hero of the Philippines. Forever in our hearts.</p>

    <button id="openBtn" class="tribute-btn">Watch the Tribute</button>
  </div>

 
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
      <video id="video" controls playsinline>
        <source src="img/rizal.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
